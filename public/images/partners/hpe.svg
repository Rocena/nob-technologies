  <!-- HPE Signature Green Rectangle Frame -->
  <rect x="6" y="10" width="46" height="30" stroke="#00B188" stroke-width="4.5" fill="none" rx="2"/>
  
  <!-- HPE Big Letters inside or next to it -->
  <text x="60" y="33" fill="#01A982" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">HPE</text>
  <text x="114" y="26" fill="#1C1C1C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">Hewlett Packard</text>
  <text x="114" y="38" fill="#525252" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.3">Enterprise</text>
</svg>
