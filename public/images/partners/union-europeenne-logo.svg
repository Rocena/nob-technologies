<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 90" width="380" height="90">
  <!-- EU Flag -->
  <g transform="translate(10, 15)">
    <rect width="90" height="60" rx="4" fill="#003399"/>
    <g fill="#FFCC00" transform="translate(45,30) scale(0.1)">
      <path id="star" d="M0,162.5 22.041947,230.338137 -35.664619,188.411863H35.664619L-22.041947,230.338137z"/>
      <use xlink:href="#star" y="-400"/>
      <g id="stars5">
        <use xlink:href="#star" transform="rotate(30) rotate(-30,0,200)"/>
        <use xlink:href="#star" transform="rotate(60) rotate(-60,0,200)"/>
        <use xlink:href="#star" transform="rotate(90) rotate(-90,0,200)"/>
        <use xlink:href="#star" transform="rotate(120) rotate(-120,0,200)"/>
        <use xlink:href="#star" transform="rotate(150) rotate(-150,0,200)"/>
      </g>
      <use xlink:href="#stars5" transform="scale(-1,1)"/>
    </g>
  </g>
  <!-- Text Designation -->
  <g transform="translate(115, 0)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="42" font-size="19" font-weight="800" fill="#003399" letter-spacing="0.5">UNION EUROPÉENNE</text>
    <text x="0" y="62" font-size="12" font-weight="600" fill="#475569" letter-spacing="0.2">Délégation au Sénégal &bull; Dakar</text>
  </g>
</svg>
