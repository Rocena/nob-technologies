<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50" fill="none">
  <!-- UBIKA Hexagon -->
  <g transform="translate(6, 9)">
    <polygon points="15,1 29,8 29,23 15,30 1,23 1,8" fill="#5E2CED"/>
    <polygon points="15,6 23,10 23,19 15,23 7,19 7,10" fill="#00D2FF"/>
  </g>
  <text x="38" y="30" fill="#1B1738" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="900">UBIKA</text>
  
  <!-- Divider -->
  <line x1="96" y1="12" x2="96" y2="38" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- PAESSLER -->
  <g transform="translate(108, 9)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#008FD5" />
    <circle cx="15" cy="15" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-dasharray="12 4" />
    <circle cx="15" cy="15" r="3" fill="#FFFFFF" />
  </g>
  <text x="145" y="30" fill="#002D4C" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="900">PAESSLER</text>
</svg>
